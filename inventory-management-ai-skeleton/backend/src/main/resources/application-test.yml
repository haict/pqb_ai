# Môi trường kiểm thử tự động. Datasource lấy từ ~/.erp/application-local.yml (on-profile: test) hoặc ERP_TEST_DB_URL.
spring:
  flyway:
    locations: classpath:db/migration,classpath:db/dev-data
    # Test tích hợp chạy trên schema riêng, được phép xóa sạch trước khi migrate.
    clean-disabled: false

springdoc:
  api-docs:
    enabled: true

erp:
  security:
    cors-allowed-origins: http://localhost:5173
  # Test thay Xinvoice bằng máy chủ HTTP giả lập trong TaxCodeLookupIntegrationTest (cổng cố định); không gọi Internet.
  tax-code-lookup:
    enabled: true
    base-url: http://127.0.0.1:18091/gdt-api/tax-payer
    client-id: test-client
    api-key: test-api-key
    connect-timeout: 1s
    read-timeout: 1s
  auth:
    # Test tích hợp đăng nhập sai nhiều lần từ cùng địa chỉ 127.0.0.1; giới hạn theo IP có unit test riêng.
    ip-rate-limit:
      max-failures: 100000

# Test thay AI Service bằng máy chủ HTTP giả lập trong test (AiServiceStub, cổng cố định); không cần Python.
ai:
  enabled: true
  service:
    base-url: http://127.0.0.1:18090
    api-key: test-ai-service-key-0001
    health-interval: 1h
  ocr:
    timeout: 2s
    acquire-timeout: 200ms
    max-file-size: 1MB
    max-image-pixels: 4000000
  chat:
    timeout: 2s
    acquire-timeout: 200ms
    max-message-chars: 200
    max-history-turns: 4
    retention-cron: "-"
  rate-limit:
    per-user-per-minute: 1000
