# Cấu hình chung cho mọi môi trường. Giá trị theo môi trường đặt qua biến môi trường
# (docs/08-environment.md). Không ghi secret vào file này.
spring:
  application:
    name: erp
  config:
    # Cấu hình riêng của từng máy (DB local, profile), nằm ngoài repo nên không bị commit
    # và không bị đóng gói vào WAR. Mẫu: backend/config/application-local.example.yml.
    import: optional:file:${ERP_CONFIG_FILE:${user.home}/.erp/application-local.yml}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      # Chờ khóa dòng tối đa N giây rồi báo LOCK_TIMEOUT (423) thay vì treo 50 giây mặc định của InnoDB.
      connection-init-sql: SET SESSION innodb_lock_wait_timeout = ${DB_LOCK_WAIT_TIMEOUT_SECONDS:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 200
  servlet:
    multipart:
      # D-41: tối đa 20 MB/file.
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:20MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:25MB}
  jackson:
    time-zone: UTC

server:
  servlet:
    # Thống nhất context path khi chạy Tomcat nhúng (Eclipse Spring Boot App, java -jar)
    # với khi triển khai erp.war lên Tomcat ngoài (Tomcat bỏ qua thuộc tính này, dùng tên WAR).
    context-path: /erp
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}

erp:
  api:
    version: 0.1.0
  license:
    # Bản quyền phần mềm (D-59). File license nạp tự động khi khởi động nếu mới hơn license đang dùng (tùy chọn);
    # ví dụ file:/opt/erp/license.lic. Không có cấu hình tắt kiểm tra license.
    import-location: ${ERP_LICENSE_FILE:}
    refresh-interval: PT1H
  calendar:
    # Múi giờ nghiệp vụ (D-15): xác định "hôm nay", ngày chứng từ, chu kỳ số chứng từ. Thời điểm vẫn lưu UTC.
    time-zone: Asia/Ho_Chi_Minh
  security:
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    public-api-docs: false
  auth:
    # Secret ký JWT (HS256), tối thiểu 32 byte; bắt buộc đặt theo môi trường (ERP_JWT_SECRET).
    jwt-secret: ${ERP_JWT_SECRET:}
    access-token-ttl: 15m
    # Phiên hết hạn khi không thao tác quá idle-timeout, và tối đa max-session-duration (BR-SYS-23).
    session-idle-timeout: 30m
    session-max-duration: 12h
    refresh-cookie-name: ERP_REFRESH
    refresh-cookie-secure: ${ERP_REFRESH_COOKIE_SECURE:true}
    password:
      min-length: 8
      require-letter: true
      require-digit: true
    lockout:
      max-failed-attempts: 5
      lock-duration: 15m
    # Giới hạn đăng nhập sai theo IP (security.md mục 7): chặn dò mật khẩu rải trên nhiều tài khoản.
    # Đếm trong bộ nhớ của một máy chủ (D-32). Sau reverse proxy phải cấu hình IP thật (RemoteIpValve / forward-headers).
    ip-rate-limit:
      max-failures: 20
      window: 15m
    # Tạo quản trị viên đầu tiên khi database chưa có người dùng (uat/prod). Bắt buộc đổi mật khẩu khi đăng nhập.
    bootstrap-admin:
      username: ${ERP_BOOTSTRAP_ADMIN_USERNAME:admin}
      password: ${ERP_BOOTSTRAP_ADMIN_PASSWORD:}
  idempotency:
    ttl: 24h
    cleanup-cron: "0 15 * * * *"
  # Tra cứu doanh nghiệp theo mã số thuế khi thêm đối tác (D-66): API Xinvoice, mã số thuế nối vào cuối base-url.
  # client-id / api-key cấp khi đăng ký API (không commit giá trị thật). Máy chủ không ra được Internet thì tắt.
  tax-code-lookup:
    enabled: ${TAX_CODE_LOOKUP_ENABLED:true}
    base-url: ${TAX_CODE_LOOKUP_BASE_URL:https://api.xinvoice.vn/gdt-api/tax-payer}
    client-id: ${TAX_CODE_LOOKUP_CLIENT_ID:}
    api-key: ${TAX_CODE_LOOKUP_API_KEY:}
    connect-timeout: 3s
    read-timeout: 8s

# Trợ lý AI và OCR (D-64, docs/14 mục 10.1). Tắt mặc định; bật cần AI Service chạy cùng máy (ai-service/).
ai:
  enabled: ${AI_ENABLED:false}
  service:
    base-url: ${AI_SERVICE_BASE_URL:http://127.0.0.1:8090}
    # Trùng AI_SERVICE_API_KEY của AI Service, tối thiểu 16 ký tự; không commit giá trị thật.
    api-key: ${AI_SERVICE_API_KEY:}
    connect-timeout: 2s
    health-interval: 30s
  ocr:
    timeout: 60s
    max-file-size: 10MB
    max-image-pixels: 40000000
    max-concurrent: 1
    acquire-timeout: 3s
    # Chênh lệch cho phép khi kiểm tra thành tiền / tổng tiền (đồng).
    amount-tolerance: 1
    max-candidates: 10
    # Độ giống tối thiểu (0..1) để đưa tên hàng vào danh sách ứng viên.
    name-similarity: 0.85
  chat:
    # Dài hơn CHAT_TIMEOUT_SECONDS của AI Service (80 s) để nhận lỗi rõ ràng từ AI Service.
    timeout: 90s
    max-concurrent: 1
    acquire-timeout: 3s
    max-message-chars: 2000
    max-history-turns: 10
    max-context-chars: 12000
    retention-days: 90
    # Xóa hội thoại quá hạn lúc 02:30 hằng ngày.
    retention-cron: "0 30 2 * * *"
  rate-limit:
    per-user-per-minute: 10
